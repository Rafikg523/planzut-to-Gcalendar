services:
  postgres:
    image: postgres:16-alpine
    container_name: planzut-postgres
    environment:
      POSTGRES_USER: planzut
      POSTGRES_PASSWORD: planzut
      POSTGRES_DB: planzut
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  

volumes:
  postgres_data: